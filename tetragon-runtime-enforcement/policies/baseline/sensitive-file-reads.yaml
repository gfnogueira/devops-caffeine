apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: trace-sensitive-file-reads
  namespace: evaluation
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values: ["4"]
            - index: 0
              operator: Prefix
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/root/.ssh/"
                - "/var/lib/kubelet/pods"
                - "/run/secrets/kubernetes.io/serviceaccount"
