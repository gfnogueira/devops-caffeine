apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: workload_identity
  definitions:
    - name: same_env_caller
      parentRoles: ["workload"]
      condition:
        match:
          expr: request.principal.attr.environment == request.resource.attr.environment

    - name: prod_workload
      parentRoles: ["workload"]
      condition:
        match:
          expr: request.principal.attr.environment == "prod"
