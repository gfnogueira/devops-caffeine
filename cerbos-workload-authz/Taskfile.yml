version: '3'

tasks:
  up:
    desc: Start the Cerbos PDP
    cmds:
      - docker compose up -d
      - sleep 2

  down:
    desc: Stop the PDP and drop the audit volume
    cmds:
      - docker compose down -v

  ping:
    desc: Probe the PDP health endpoint
    cmds:
      - curl -sf http://localhost:3592/_cerbos/health && echo

  check:allow:
    desc: Same-environment service call should return EFFECT_ALLOW
    cmds:
      - >
        curl -sS -X POST http://localhost:3592/api/check/resources
        -H 'content-type: application/json'
        -d @checks/allow-same-env.json | jq .

  check:deny:
    desc: Cross-environment service call should return EFFECT_DENY
    cmds:
      - >
        curl -sS -X POST http://localhost:3592/api/check/resources
        -H 'content-type: application/json'
        -d @checks/deny-cross-env.json | jq .
