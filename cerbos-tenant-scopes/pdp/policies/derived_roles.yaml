apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: tenant_member
  definitions:
    - name: tenant_owner
      parentRoles: ["member"]
      condition:
        match:
          expr: request.principal.attr.tenant == request.resource.attr.tenant

    - name: cross_tenant
      parentRoles: ["member"]
      condition:
        match:
          expr: request.principal.attr.tenant != request.resource.attr.tenant
