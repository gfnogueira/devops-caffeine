apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: registry-signed-enforce
spec:
  mode: enforce
  images:
    - glob: "registry.local:5000/**"
  authorities:
    - name: local-key
      key:
        data: |
          -----BEGIN PUBLIC KEY-----
          REPLACE_ME_WITH_cosign.pub
          -----END PUBLIC KEY-----
