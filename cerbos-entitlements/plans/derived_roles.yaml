apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: plan_status
  definitions:
    - name: plan_free
      parentRoles: ["tenant"]
      condition:
        match:
          expr: request.principal.attr.plan == "free"

    - name: plan_pro
      parentRoles: ["tenant"]
      condition:
        match:
          expr: request.principal.attr.plan == "pro"

    - name: plan_enterprise
      parentRoles: ["tenant"]
      condition:
        match:
          expr: request.principal.attr.plan == "enterprise"

    - name: in_trial
      parentRoles: ["tenant"]
      condition:
        match:
          expr: request.principal.attr.trial_days_left > 0

    - name: billing_active
      parentRoles: ["tenant"]
      condition:
        match:
          expr: request.principal.attr.billing_status == "active"
