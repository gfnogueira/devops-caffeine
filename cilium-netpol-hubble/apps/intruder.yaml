apiVersion: v1
kind: Namespace
metadata:
  name: intruder
  labels:
    tier: untrusted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: intruder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
        tier: untrusted
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.9.1
          command: ["sleep", "infinity"]
